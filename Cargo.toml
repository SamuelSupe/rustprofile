[package]
name = "rustprofile"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
description = "Continuous CPU and sampled heap profiling for native Rust processes"
license = "Apache-2.0 OR MIT"
keywords = ["profiling", "ebpf", "pprof", "linux", "performance"]
categories = ["development-tools::profiling"]
build = "build.rs"

[dependencies]
addr2line = { version = "0.27.1", default-features = false, features = ["loader", "rustc-demangle", "cpp_demangle"] }
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive"] }
crossbeam-channel = "0.5.15"
flate2 = "1.1.5"
framehop = { version = "0.16.0", default-features = false, features = ["std"] }
framehop-object = "0.2.0"
fxprof-processed-profile = { git = "https://github.com/mstange/samply", rev = "bc0cd2fe29c9de471653c0891162569760fa0e5e" }
hex = "0.4.3"
http-body-util = "0.1.3"
hyper = { version = "1.8.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.18", features = ["http1", "server", "tokio"] }
humantime = "2.3.0"
json-slabs = "0.2.0"
libc = "0.2.177"
linux-perf-data = "0.13"
object = { version = "0.40.0", features = ["compression", "elf", "read_core", "std"] }
parse-size = "1.1.0"
prost = "0.14.1"
rustc-demangle = "0.1.26"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
signal-hook = "0.4.3"
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["fs", "macros", "net", "rt-multi-thread", "signal"] }
ureq = { version = "3.1.2", default-features = false, features = ["rustls"] }
wholesym = { git = "https://github.com/mstange/samply", rev = "bc0cd2fe29c9de471653c0891162569760fa0e5e", features = ["api"] }
rustls-native-certs = "0.8.4"

[target.'cfg(target_os = "linux")'.dependencies]
libbpf-rs = "0.27.0"
memmap2 = "0.9.8"
perf-event-open-sys = "6.0.0"

[target.'cfg(target_os = "linux")'.build-dependencies]
libbpf-cargo = "0.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
